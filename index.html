<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee-ordering Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <!-- Header / Navbar-->
  <header>
    <nav class="navbar section-content">
      <a href="#" class="nav-logo">
        <i class="fa-solid fa-mug-hot logo-icon"></i>
        <h2 class="logo-text">Morning<span>Mug</span></h2>
      </a>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#" class="nav-link">Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">About</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Menu</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Testimonials</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Gallery</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">Contact</a>
        </li>
      </ul>
      <div class="nav-buttons">
        <a href="" class="search-btn">
          <i class="fa-solid fa-magnifying-glass button-icon"></i>
        </a>
        <a href="" class="account-btn">
          <i class="fa-solid fa-user button-icon"></i>
        </a>
      </div>

    </nav>
  </header>

  <main>
    <!--Hero section -->
    <section class="hero-section">
      <div class="section-content">
        <div class="hero-details">
          <h2 class="title"> THE ART OF BEST COFFEE</h2>
          <h3 class="subtitle">Make your day great with our special coffee</h3>
          <p class="description">Experiance the rich and bold flavors of our exquisite coffee blends. crafted to awaken your senses and start your day right</p>
          <div class="buttons ">
            <a href="#" class="button order-now">Order Now 
              <i class="fa-solid fa-arrow-right button-icon"></i>
            </a>
            <a href="#" class="button contact-us   ">Contact Us</a>
          </div>
        </div>
        <div class="hero-image-wrapper"> 
          <img src="images/coffee-image.PNG" alt="Delicious Coffee" class="hero-image">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
